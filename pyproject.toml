[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edusense-ai-360"
version = "1.0.0"
description = "AI-Powered Smart Classroom Engagement & Teaching Quality Monitoring System"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
